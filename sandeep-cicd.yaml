pool: sandeep
trigger: none

parameters:
- name: environment
  displayName: envName
  type: string
  default: dev
  values: 
    - dev
    - qa
    - prod

variables:
  workingDir: '$(System.DefaultWorkingDirectory)'
  serviceConnection: 'myvisit-ado'
  storageAccount: 'stgtfstatesandeep1'
  containerName: 'tfstate'
  # stateKey: 'terraform.tfstate'

stages:
  - template: templates/terraform-validate.yml
    parameters:
      environment: ${{ parameters.environment }}
      workingDir: $(workingDir)
      serviceConnection: $(serviceConnection)
      storageAccount: $(storageAccount)
      containerName: $(containerName)
      stateKey: ${{ parameters.environment }}.tfstate
  - template: templates/terraform-security.yml
    parameters:
      environment: ${{ parameters.environment }}
      workingDir: $(workingDir)
      
  - template: templates/terraform-plan.yml
    parameters:
      environment: ${{ parameters.environment }}
      workingDir: $(workingDir)
      serviceConnection: $(serviceConnection)
      storageAccount: $(storageAccount)
      containerName: $(containerName)
      stateKey: ${{ parameters.environment }}.tfstate

  - stage: manualApproval
    jobs:
      - job: manualApproval
        displayName: manualApproval
        pool: server
        steps:
        - task: ManualValidation@1
          inputs:
            notifyUsers: 'pankaj.tiwari.devops@gmail.com'
            instructions: 'please approve'


  - template: templates/terraform-apply.yaml
    parameters:
      environment: ${{ parameters.environment }}
      workingDir: $(workingDir)
      serviceConnection: $(serviceConnection)
      storageAccount: $(storageAccount)
      containerName: $(containerName)
